<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - Notes</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar"><a href="/" style="text-decoration:none;"><div class="brand"><img src="/aditya-logo.png" alt="Logo" class="brand-logo"><div class="brand-text"><span class="app">Notes</span></div></div></a></header>
<main class="page narrow">
  <div class="hero" style="padding-top:1.5rem;"><div class="eyebrow">Account recovery</div><h1 style="font-size:2rem;">Choose a new password</h1></div>
  <section class="card">
    <div id="message" class="alert" hidden></div>
    <form id="reset-form"><div class="field"><label for="password">New password</label><input id="password" type="password" minlength="4" required autocomplete="new-password"></div><div class="field"><label for="confirm">Confirm password</label><input id="confirm" type="password" minlength="4" required autocomplete="new-password"></div><button class="btn btn-primary btn-block" type="submit">Save password</button></form>
  </section>
</main>
<script src="/js/supabase-client.js"></script>
<script>
(async function () {
  const supabase = await window.supabaseReady;
  const form = document.getElementById('reset-form');
  const message = document.getElementById('message');
  const passwordInput = document.getElementById('password');
  const confirmInput = document.getElementById('confirm');

  form.addEventListener('submit', async function (event) {
    event.preventDefault();
    const newPassword = passwordInput.value;
    const confirmPassword = confirmInput.value;
    if (newPassword !== confirmPassword) {
      message.textContent = 'Passwords do not match.';
      message.className = 'alert alert-error';
      message.hidden = false;
      return;
    }
    if (newPassword.length < 4) {
      message.textContent = 'Password must be at least 4 characters.';
      message.className = 'alert alert-error';
      message.hidden = false;
      return;
    }
    const result = await supabase.auth.updateUser({ password: newPassword });
    if (result.error) {
      message.textContent = result.error.message;
      message.className = 'alert alert-error';
      message.hidden = false;
      return;
    }
    message.textContent = 'Password updated. You can now log in.';
    message.className = 'alert alert-success';
    message.hidden = false;
    setTimeout(function () { window.location.href = '/login.html'; }, 1000);
  });
})();
</script>
</body>
</html>
